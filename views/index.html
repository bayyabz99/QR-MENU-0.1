<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#6B2D8B">
<title id="pageTitle">QR Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/menu.css">
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ALLERGEN MODAL -->
<div class="modal-overlay" id="allergenModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <button type="button" class="modal-close" id="allergenModalClose" aria-label="Kapat">✕</button>
    <p class="modal-title" data-tr="🏷️ Alerjen Rehberi" data-en="🏷️ Allergen guide">🏷️ Alerjen Rehberi</p>
    <p class="modal-intro" data-tr="Ürünlerimizde kullanılan alerjenler aşağıda belirtilmiştir. Her ürünün detay sayfasında alerjen bilgisi ayrıca gösterilmektedir." data-en="Common allergens are listed below. Each product detail page also shows allergen information."
      style="font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.6;">
      Ürünlerimizde kullanılan alerjenler aşağıda belirtilmiştir. Her ürünün detay sayfasında alerjen bilgisi ayrıca gösterilmektedir.
    </p>
    <div class="allergen-full-grid" id="allergenFullGrid"></div>
  </div>
</div>

<!-- ===== PAGE: MENU ===== -->
<div class="page active" id="page-menu">
  <div class="menu-header">
    <span class="menu-logo" id="menuBrandName">KAFEM</span>
    <div class="menu-header-actions" style="display:flex;gap:8px;align-items:center;">
      <button type="button" class="allergen-btn" id="allergenGuideBtn" data-tr="🏷️ Alerjenler" data-en="🏷️ Allergens">🏷️ Alerjenler</button>
    </div>
  </div>

  <div class="search-bar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" autocomplete="off">
    </div>
  </div>

  <div class="quick-nav" id="quickNav"></div>

  <div class="categories-container" id="categoriesContainer">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
</div>

<!-- ===== PAGE: DETAIL ===== -->
<div class="page" id="page-detail">
  <button type="button" class="detail-back" id="detailBackBtn" aria-label="Geri">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <div id="detailContent"></div>
</div>

<div id="menuFooter" style='text-align:center;padding:20px 0 8px;font-size:11px;color:rgba(107,45,139,0.4);display:none;'></div>

<script src="/js/main.js"></script>
</body>
</html>
